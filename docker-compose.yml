# docker compose up                          — сайт + PostgreSQL
# docker compose --profile observability up  — плюс Prometheus и Grafana
services:
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Вторая БД проекта: S3-совместимое хранилище 3D-моделей (в проде — любой S3: AWS, Yandex Object Storage и т. п.)
  s3:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [s3data:/data]
    ports: ["9001:9001"]   # консоль MinIO; сам S3 доступен внутри сети compose на s3:9000
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [observability]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    ports: ["3000:3000"]

volumes:
  pgdata:
  s3data:
